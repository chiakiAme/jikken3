<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISERY // 簿記サスペンスアドベンチャー</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --blood: #8b0000;
      --blood-light: #b22222;
      --bg-dark: #121417;
      --card-bg: #1c2024;
      --antique-paper: #f4ede1;
      --typewriter-ink: #22201e;
      --snow: #e6edf3;
      --gold: #d4af37;
      --wood: #4a3525;
      --border: #3d444d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Courier New", Courier, "Hiragino Mincho ProN", "Yu Mincho", serif;
      color: var(--snow);
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 10%, #252b33 0%, #0d0f12 100%);
      padding: 16px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 3px solid var(--blood);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(139, 0, 0, 0.4);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 14px;
    }
    .logo-area { display: flex; align-items: center; gap: 14px; }
    .typewriter-svg { width: 46px; height: 46px; flex-shrink: 0; fill: var(--gold); }
    .logo-title {
      margin: 0;
      font-size: 1.25rem;
      color: #ff4d4d;
      letter-spacing: 2px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .status-badge {
      background: var(--blood);
      color: var(--snow);
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--gold);
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .status-badge.review {
      background: var(--gold);
      color: #1a1a1a;
    }

    /* 5段階ステージ切り替えタブ */
    .stage-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    @media (max-width: 520px) {
      .stage-tabs {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .stage-btn {
      padding: 9px 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #262c33;
      font-size: 0.7rem;
      font-weight: bold;
      color: #a0aec0;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      line-height: 1.3;
    }
    .stage-btn:hover {
      background: #323a44;
      color: var(--snow);
    }
    .stage-btn.active {
      background: var(--blood);
      color: #ffffff;
      border-color: #ff6666;
      box-shadow: 0 0 10px rgba(178, 34, 34, 0.6);
    }

    .story-progress {
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #14171a;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .progress-track {
      height: 8px;
      width: 100%;
      background: #2d333b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--blood), #ff4d4d);
      transition: width 0.3s ease;
    }
    .card {
      background: var(--antique-paper);
      color: var(--typewriter-ink);
      border: 2px solid #332a22;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.15);
      position: relative;
    }
    .card::before {
      content: "ROYAL 10 - MANUSCRIPT";
      position: absolute;
      top: 6px;
      right: 12px;
      font-size: 0.55rem;
      color: #7d7065;
      letter-spacing: 1px;
    }
    .question-label {
      display: inline-block;
      background: var(--blood);
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .story-text { margin: 0; font-size: 0.96rem; line-height: 1.7; font-weight: 600; }
    
    .split-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    @media(max-width: 560px) { .split-container { grid-template-columns: 1fr; } }
    .side-column {
      padding: 12px;
      background: #181c20;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .side-column.credit { border-color: #5c2424; background: #1c1818; }
    .side-title { text-align: center; margin-bottom: 8px; font-weight: bold; font-size: 0.85rem; color: #cbd5e1; }
    .entry-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .entry-row input {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.9rem;
      background: #0d1117;
      color: var(--snow);
      width: 100%;
      font-family: inherit;
    }
    .entry-row input[type="text"] { flex: 1.3; }
    .entry-row input[type="number"] { flex: 1; }
    .entry-row input:focus { outline: none; border-color: var(--gold); }
    .btn-remove {
      background: #2d1919;
      border: 1px solid #5c2424;
      border-radius: 4px;
      color: #ff8080;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add {
      width: 100%;
      padding: 6px;
      background: #21262d;
      border: 1px dashed var(--border);
      color: #c9d1d9;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-add:hover { background: #30363d; }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--blood);
      color: white;
      border: 1px solid #ff6666;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(139, 0, 0, 0.4);
      letter-spacing: 1px;
      font-family: inherit;
    }
    .btn-submit:hover { background: var(--blood-light); }
    .result-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .result-box.correct { background: #12261a; border: 1px solid #2ea043; color: #7ee787; }
    .result-box.wrong { background: #2b1314; border: 1px solid #da3633; color: #f85149; }
    .nav-buttons { display: flex; gap: 10px; margin-top: 14px; }
    .nav-btn {
      flex: 1;
      padding: 10px;
      background: #21262d;
      color: var(--snow);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .nav-btn:hover { background: #30363d; }
    .clear-card { display: none; text-align: center; padding: 24px 16px; }
    .btn-restart {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #30363d;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-family: inherit;
    }
    details {
      margin-top: 20px;
      border-top: 1px dashed var(--border);
      padding-top: 14px;
    }
    summary {
      cursor: pointer;
      font-size: 0.8rem;
      color: #8b949e;
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-top: 10px;
      padding: 10px;
      background: #0d1117;
      color: var(--snow);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: monospace;
      resize: vertical;
    }
    .load-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .reset-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      font-size: 0.75rem;
      color: #8b949e;
      cursor: pointer;
      text-decoration: underline;
    }

    /* 映画的演出：大ハンマーや恐怖に震えるブルブル */
    .shake-animation {
      animation: heavyShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes heavyShake {
      10%, 90% { transform: translate3d(-4px, 0, 0); }
      20%, 80% { transform: translate3d(6px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    /* 正解演出：雪、タイプライターの紙片、炎の火の粉が舞い上がる */
    .rising-item {
      position: fixed;
      bottom: -30px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: riseUp ease-out forwards;
    }
    @keyframes riseUp {
      0% { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0; }
      15% { opacity: 0.95; }
      50% { transform: translateY(-50vh) translateX(var(--drift, 20px)) scale(1.1) rotate(180deg); opacity: 0.9; }
      85% { opacity: 0.7; }
      100% { transform: translateY(-110vh) translateX(calc(var(--drift, 20px) * -1)) scale(1.3) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="header">
    <div class="logo-area">
      <!-- タイプライターアイコン -->
      <svg class="typewriter-svg" viewBox="0 0 24 24">
        <path d="M4 3h16a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm0 7h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 3v2h2v-2H6zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2zm-8 4v2h8v-2H6z"/>
      </svg>
      <div>
        <h1 class="logo-title">MISERY BOKI</h1>
        <div style="font-size:0.7rem; color:#8b949e;" id="sub-title">〜 アニー・ウィルクスの雪深き孤立山荘 〜</div>
      </div>
    </div>
    <span class="status-badge" id="status-tag">❄️ 監禁中</span>
  </div>

  <!-- ステージ切り替えタブ (全5段階) -->
  <div class="stage-tabs">
    <button type="button" class="stage-btn active" id="tab-0" onclick="switchStage(0)">Lv.1<br>吹雪の救出</button>
    <button type="button" class="stage-btn" id="tab-1" onclick="switchStage(1)">Lv.2<br>ナンバーワンファン</button>
    <button type="button" class="stage-btn" id="tab-2" onclick="switchStage(2)">Lv.3<br>原稿焼却と執筆</button>
    <button type="button" class="stage-btn" id="tab-3" onclick="switchStage(3)">Lv.4<br>大ハンマーの制裁</button>
    <button type="button" class="stage-btn" id="tab-4" onclick="switchStage(4)">Lv.5<br>死闘と最後の原稿</button>
  </div>

  <div class="story-progress">
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold;">
      <span id="stage-badge-text">❄️ Lv.1 吹雪の転落と救出編</span>
      <span id="progress-text">第 1 問</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="quiz-area">
    <div class="card">
      <div class="question-label" id="q-number">CHAPTER // 01</div>
      <p class="story-text" id="story-display">読み込み中...</p>
    </div>

    <div class="split-container">
      <div class="side-column">
        <div class="side-title">✒️ 借方 (Debit)</div>
        <div id="debit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('debit')">＋ 科目を追加</button>
      </div>
      <div class="side-column credit">
        <div class="side-title">🩸 貸方 (Credit)</div>
        <div id="credit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('credit')">＋ 科目を追加</button>
      </div>
    </div>

    <button type="button" class="btn-submit" id="submit-btn" onclick="checkAnswer()">打鍵して仕訳を刻む（判定）</button>
    <div id="result-display" class="result-box"></div>

    <div class="nav-buttons">
      <button type="button" class="nav-btn" onclick="prevQuestion()">◀ 前の記憶へ</button>
      <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">次のページへ ▶</button>
    </div>
  </div>

  <div id="clear-area" class="clear-card">
    <h2 style="color:#ff6666;">📖 チャプター走破</h2>
    <div id="complete-badge-area"></div>
    <p id="score-text" style="line-height:1.7; color:#c9d1d9;"></p>
    <div id="review-btn-area"></div>
    <button type="button" class="btn-restart" onclick="startFreshStage()">この章をもう一度生き延びる</button>
  </div>

  <details>
    <summary>📂 外部の手記データ（JSON）を取り込む</summary>
    <textarea id="json-input" placeholder="作成したJSON配列をここに貼り付けると、現在の章を上書きできます"></textarea>
    <button type="button" class="load-btn" onclick="loadCustomData()">手記を書き換える</button>
  </details>

  <span class="reset-link" onclick="forceReset()">※ 記録が乱れた時はここを押してすべて初期化</span>
</div>
<script>
const STAGES = [
  {
    title: "Lv.1 吹雪の転落と救出編",
    questions: [
      {
        "story": "【猛吹雪のコロラド】流行作家ポール・シェルダンは新作小説を脱稿後、猛吹雪の峠道で車ごと崖下へ転落した。大破した愛車（車両運搬具）の帳簿価額 450,000円全額を固定資産除却損として計上した。（固定資産除却損）（車両運搬具）",
        "debit": [{ "account": "固定資産除却損", "amount": 450000 }],
        "credit": [{ "account": "車両運搬具", "amount": 450000 }],
        "explanation": "事故により物理的に全損した資産（Asset）である車両運搬具（Vehicles）を貸方に減額し、損失である費用（Expense）の固定資産除却損（Loss on Retirement of Fixed Assets）を借方に計上します。"
      },
      {
        "story": "【熱狂的ファンの救出】意識を失ったポールを怪力で車から引きずり出し自宅の隔離山荘へ運び込んだ元看護師アニー・ウィルクスは、両脚骨折のポールを固定するための中古車椅子（備品）35,000円を現金で購入した。（備品）（現金）",
        "debit": [{ "account": "備品", "amount": 35000 }],
        "credit": [{ "account": "現金", "amount": 35000 }],
        "explanation": "長期間使用する器具・備品の取得に伴い、資産（Asset）である備品（Equipment）を借方に記入し、資産である現金（Cash）の減少を貸方に記入します。"
      },
      {
        "story": "【激痛と鎮痛剤ノヴリル】激痛に叫ぶポールに対し、アニーは常備していた医療用強力鎮痛剤ノヴリル（消耗品費）12,000円分を投与した。代金は以前に現金で支払っていた。（消耗品費）（現金）",
        "debit": [{ "account": "消耗品費", "amount": 12000 }],
        "credit": [{ "account": "現金", "amount": 12000 }],
        "explanation": "医療資材や薬品類の消費に伴う費用（Expense）である消耗品費（Supplies Expense）を借方に計上し、資産（Asset）である現金（Cash）の減少を貸方に記入します。"
      },
      {
        "story": "【山荘の暖房燃料】猛烈な寒波で孤立した山荘を暖めるため、プロパンガスおよび薪（水道光熱費）28,000円分を購入し、普通預金口座から支払った。（水道光熱費）（普通預金）",
        "debit": [{ "account": "水道光熱費", "amount": 28000 }],
        "credit": [{ "account": "普通預金", "amount": 28000 }],
        "explanation": "暖房燃料や光熱の消費に伴う費用（Expense）である水道光熱費（Utilities Expense）を借方に記入し、資産（Asset）である普通預金（Ordinary Deposit）の減少を貸方に記入します。"
      },
      {
        "story": "【愛豚ミザリーのエサ代】アニーは自慢のペットである雌豚の「ミザリー」のために、飼料用トウモロコシ（消耗品費）8,000円を掛けで購入した。（消耗品費）（買掛金）",
        "debit": [{ "account": "消耗品費", "amount": 8000 }],
        "credit": [{ "account": "買掛金", "amount": 8000 }],
        "explanation": "消費資材の購入に伴う費用（Expense）である消耗品費（Supplies Expense）を借方に記入し、未払債務である負債（Liability）の買掛金（Accounts Payable）を貸方に記入します。"
      },
      {
        "story": "【外部遮断と電話線不通】アニーは「電話線が吹雪で切れている」と嘘をつき、ポールが外部と連絡を取れないよう工作した。山荘の防雪・防犯シャッター（建物付属設備）80,000円の据付代金を現金で支払った。（建物付属設備）（現金）",
        "debit": [{ "account": "建物付属設備", "amount": 80000 }],
        "credit": [{ "account": "現金", "amount": 80000 }],
        "explanation": "建物自体の価値を高め固定化する設備は、資産（Asset）である建物付属設備（Building Facilities）として借方に計上し、現金（Cash）の減少を貸方に記入します。"
      },
      {
        "story": "【小説ミザリー最新刊の購入】アニーは待ちきれず、町の本屋で発売されたばかりのポールのシリーズ最終巻『ミザリーの子供』を買いに走り、図書費（新聞図書費）3,500円を現金で支払った。（新聞図書費）（現金）",
        "debit": [{ "account": "新聞図書費", "amount": 3500 }],
        "credit": [{ "account": "現金", "amount": 3500 }],
        "explanation": "書籍や雑誌等の購入に伴う費用（Expense）である新聞図書費（Books and Periodicals Expense）を借方に記入し、現金（Cash）の減少を貸方に記入します。"
      },
      {
        "story": "【アニーの怪しげな副収入】アニーはかつて看護師長時代に得た私的財産の一部である公社債の利息 22,000円を当座預金口座で受け取った。（当座預金）（受取利息）",
        "debit": [{ "account": "当座預金", "amount": 22000 }],
        "credit": [{ "account": "受取利息", "amount": 22000 }],
        "explanation": "金融資産からの果実として収益（Revenue）である受取利息（Interest Income）を貸方に計上し、資産（Asset）である当座預金（Checking Account）の増加を借方に記入します。"
      },
      {
        "story": "【ポールの貴重品管理】アニーはポールの財布から所持金 50,000円を「預かり金」として抜き取り、自宅の金庫に保管した。（現金）（預り金）",
        "debit": [{ "account": "現金", "amount": 50000 }],
        "credit": [{ "account": "預り金", "amount": 50000 }],
        "explanation": "他人から一時的に金銭を預かった義務は負債（Liability）である預り金（Deposits Received）として貸方に計上し、手許の資産（Asset）である現金（Cash）の増加を借方に記入します。"
      },
      {
        "story": "【不穏な平穏と夜間預金】吹雪の第1夜が過ぎた。アニーは手持ちの現金 60,000円を町の銀行の当座預金口座へ預け入れた。（当座預金）（現金）",
        "debit": [{ "account": "当座預金", "amount": 60000 }],
        "credit": [{ "account": "現金", "amount": 60000 }],
        "explanation": "資産（Asset）である当座預金（Checking Account）の増加を借方に記入し、同じく資産である現金（Cash）の減少を貸方に記入します。"
      }
    ]
  },
  {
    title: "Lv.2 ナンバーワンファン激昂編",
    questions: [

      {

      },
      {
        "story": "【生還の決算】ポールは恐怖を抱えながらも作家として生きることを誓った。手許に残った現金 150,000円を普通預金口座へ預け入れた。（普通預金）（現金）",
        "debit": [{ "account": "普通預金", "amount": 150000 }],

        "explanation": "資産（Asset）である普通預金（Ordinary Deposit）の増加を借方に記入し、手許の現金（Cash）の減少を貸方に記入します。"

];
let currentStageIndex = 0;
let currentQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let answeredSet = new Set();
let isReviewMode = false;

function init() {
  const savedStage = localStorage.getItem("misery_current_stage");
  currentStageIndex = savedStage ? parseInt(savedStage, 10) : 0;
  if (currentStageIndex < 0 || currentStageIndex >= STAGES.length) currentStageIndex = 0;

  loadStage(currentStageIndex);
}

function switchStage(stageIdx) {
  if (stageIdx === currentStageIndex && !isReviewMode) return;
  loadStage(stageIdx);
}

function loadStage(stageIdx) {
  currentStageIndex = stageIdx;
  localStorage.setItem("misery_current_stage", currentStageIndex);

  for (let i = 0; i < STAGES.length; i++) {
    const btn = document.getElementById(`tab-${i}`);
    if (btn) {
      if (i === stageIdx) btn.classList.add("active");
      else btn.classList.remove("active");
    }
  }

  const stageObj = STAGES[stageIdx];
  document.getElementById("stage-badge-text").textContent = `❄️ ${stageObj.title}`;
  document.getElementById("sub-title").textContent = `〜 ${stageObj.title} 〜`;

  const keyPrefix = `misery_st${stageIdx}_`;
  let stageData = stageObj.questions;
  try {
    const customData = localStorage.getItem(`${keyPrefix}data`);
    if (customData) {
      const parsed = JSON.parse(customData);
      if (Array.isArray(parsed) && parsed.length > 0) stageData = parsed;
    }
  } catch(e) {}

  currentQuestions = [...stageData];
  currentIndex = 0;
  correctCount = 0;
  wrongList = [];
  isReviewMode = false;
  answeredSet.clear();

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";
  loadQuestion(0);
}

function createRowHTML(account = "", amount = "") {
  const div = document.createElement("div");
  div.className = "entry-row";
  div.innerHTML = `
    <input type="text" placeholder="科目" value="${account}">
    <input type="number" placeholder="金額" value="${amount}">
    <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
  `;
  return div;
}

function addRow(side) {
  const container = document.getElementById(`${side}-rows`);
  if (container) container.appendChild(createRowHTML());
}

function removeRow(btn) {
  const row = btn.closest(".entry-row");
  if (row && row.parentElement && row.parentElement.children.length > 1) {
    row.remove();
  } else {
    alert("最低1行は必要です。");
  }
}

function loadQuestion(index) {
  if (!currentQuestions || currentQuestions.length === 0) return;
  if (index < 0 || index >= currentQuestions.length) index = 0;
  currentIndex = index;

  const tag = document.getElementById("status-tag");
  if (isReviewMode) {
    tag.textContent = "🔄 悪夢の反芻";
    tag.className = "status-badge review";
  } else {
    tag.textContent = "❄️ 監禁中";
    tag.className = "status-badge";
  }

  const prefix = isReviewMode ? "🔄 復習" : `CHAPTER ${currentStageIndex + 1}`;
  document.getElementById("q-number").textContent = `${prefix} // ${index + 1} / ${currentQuestions.length}`;
  document.getElementById("story-display").textContent = currentQuestions[index].story;

  document.getElementById("debit-rows").innerHTML = "";
  document.getElementById("credit-rows").innerHTML = "";
  addRow("debit");
  addRow("credit");

  const res = document.getElementById("result-display");
  res.style.display = "none";
  res.className = "result-box";
  document.getElementById("submit-btn").style.display = "block";

  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "章の結末へ 📖" : "次のページへ ▶";

  const percent = Math.round(((index + 1) / currentQuestions.length) * 100);
  document.getElementById("progress-fill").style.width = percent + "%";
  document.getElementById("progress-text").textContent = `${index + 1} / ${currentQuestions.length} 節 (${percent}%)`;
}

function getEntries(side) {
  const container = document.getElementById(`${side}-rows`);
  if (!container) return [];
  const rows = container.children;
  const entries = [];
  for (let row of rows) {
    const inputs = row.querySelectorAll("input");
    if (inputs.length >= 2) {
      const account = inputs[0].value.trim();
      const amount = parseInt(inputs[1].value, 10);
      if (account && !isNaN(amount)) entries.push({ account, amount });
    }
  }
  return entries;
}

// 正解演出：雪片、タイプライターの紙片、火の粉が舞い上がる
function spawnRisingMagic() {
  const symbols = ["❄️", "📄", "🔥", "✒️", "🩸", "⌨️", "📖"];
  const totalItems = 26;

  for (let i = 0; i < totalItems; i++) {
    const item = document.createElement("div");
    item.className = "rising-item";
    item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    item.style.left = (Math.random() * 92 + 4) + "vw";
    
    const driftX = (Math.random() * 80 - 40) + "px";
    item.style.setProperty("--drift", driftX);

    const size = Math.random() * 16 + 18;
    const duration = Math.random() * 1.5 + 2.0;
    const delay = Math.random() * 0.4;

    item.style.fontSize = size + "px";
    item.style.animationDuration = duration + "s";
    item.style.animationDelay = delay + "s";

    document.body.appendChild(item);

    setTimeout(() => {
      item.remove();
    }, (duration + delay) * 1000);
  }
}

// 不正解演出：大ハンマーの一撃のような激しい画面揺れ
function triggerShake() {
  const container = document.getElementById("mainContainer");
  container.classList.remove("shake-animation");
  void container.offsetWidth;
  container.classList.add("shake-animation");

  setTimeout(() => {
    container.classList.remove("shake-animation");
  }, 500);
}

function checkAnswer() {
  const q = currentQuestions[currentIndex];
  const userDebit = getEntries("debit");
  const userCredit = getEntries("credit");

  const normalize = d => Array.isArray(d) ? d : [d];
  const cDebit = normalize(q.debit);
  const cCredit = normalize(q.credit);

  const matchSide = (u, c) => {
    if (u.length !== c.length) return false;
    const sU = [...u].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    const sC = [...c].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    return sU.every((v, i) => v.account === sC[i].account && v.amount === sC[i].amount);
  };

  const isOk = matchSide(userDebit, cDebit) && matchSide(userCredit, cCredit);
  const res = document.getElementById("result-display");
  res.style.display = "block";

  if (isOk) {
    spawnRisingMagic();
    res.className = "result-box correct";
    res.innerHTML = `<strong>打鍵成功（正解）</strong><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      correctCount++;
      if (isReviewMode) wrongList = wrongList.filter(item => item.story !== q.story);
      answeredSet.add(currentIndex);
    }
  } else {
    triggerShake();
    res.className = "result-box wrong";
    const dStr = cDebit.map(d => `(${d.account}: ${d.amount.toLocaleString()}円)`).join(" ");
    const cStr = cCredit.map(c => `(${c.account}: ${c.amount.toLocaleString()}円)`).join(" ");
    res.innerHTML = `<strong>ミスタッチ（不正解）アニーが睨みつけている…</strong><br>借方: ${dStr}<br>貸方: ${cStr}<br><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      if (!wrongList.some(item => item.story === q.story)) wrongList.push(q);
      answeredSet.add(currentIndex);
    }
  }
}

function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
  else showClearScreen();
}

function showClearScreen() {
  document.getElementById("quiz-area").style.display = "none";
  const clearArea = document.getElementById("clear-area");
  clearArea.style.display = "block";

  const total = currentQuestions.length;
  const badgeArea = document.getElementById("complete-badge-area");
  const scoreText = document.getElementById("score-text");
  const revArea = document.getElementById("review-btn-area");

  badgeArea.innerHTML = "";
  revArea.innerHTML = "";

  if (wrongList.length === 0) {
    spawnRisingMagic();
    badgeArea.innerHTML = `<div style="display:inline-block; padding:6px 14px; background:#12261a; border:1px solid #2ea043; border-radius:4px; font-weight:bold; color:#7ee787; margin-bottom:12px;">🏆 この章を完全に切り抜けた</div>`;
    scoreText.innerHTML = `全節正解。完璧な原稿を完成させ、生き延びた。（${total} / ${total}）`;
  } else {
    scoreText.innerHTML = `${total} 節中 ${correctCount} 節 正解。<br>まだアニーの疑念（誤答）が ${wrongList.length} 件 残っている。`;
    const btn = document.createElement("button");
    btn.className = "btn-restart";
    btn.style.background = "#8b0000";
    btn.style.borderColor = "#ff6666";
    btn.textContent = `🔄 間違えた節だけ書き直す (${wrongList.length}問)`;
    btn.onclick = () => {
      isReviewMode = true;
      currentQuestions = [...wrongList];
      currentIndex = 0;
      correctCount = 0;
      answeredSet.clear();
      document.getElementById("quiz-area").style.display = "block";
      clearArea.style.display = "none";
      loadQuestion(0);
    };
    revArea.appendChild(btn);
  }
}

function startFreshStage() {
  loadStage(currentStageIndex);
}

function forceReset() {
  localStorage.clear();
  location.reload();
}

function loadCustomData() {
  const input = document.getElementById("json-input").value.trim();
  if (!input) {
    alert("JSONデータを貼り付けてください。");
    return;
  }
  try {
    const data = JSON.parse(input);
    if (!Array.isArray(data) || data.length === 0) throw new Error();

    STAGES[currentStageIndex].questions = data;
    localStorage.setItem(`misery_st${currentStageIndex}_data`, JSON.stringify(data));
    loadStage(currentStageIndex);
    alert(`CHAPTER ${currentStageIndex + 1} に新しい手記データ（全${data.length}問）を取り込みました。`);
  } catch (e) {
    alert("⚠️ JSONデータの形式を確認してください。正しく貼り付けられているかチェックをお願いします。");
  }
}

window.addEventListener("DOMContentLoaded", init);
</script>
